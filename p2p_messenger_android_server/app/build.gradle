plugins {
    id 'com.android.application'
    id 'org.jetbrains.kotlin.android'
}

// Typeon sunucu uygulaması — istemciden AYRI bir APK.
//
// Neden ayrı proje: istemcinin derlemesi bundan hiç etkilenmesin. İkisi tek
// bir Gradle projesinde iki modül olsaydı, sunucunun Rust crate'i (kendi
// cargo-ndk çağrısıyla) her istemci derlemesine de eklenirdi.
//
// GERÇEKÇİ DAĞITIM UYARISI: Android, bellek baskısı altında bir foreground
// service'i yine de öldürebilir. Bu uygulama "evde duran, sürekli fişte bir
// yedek telefon" senaryosu içindir; sürekli çalışması gereken bir sunucu için
// küçük bir VPS'te `typeon-server` daemon'ı önerilir (bkz. typeon-server/README.md).
android {
    namespace 'com.p2p.messenger.server'
    compileSdk 34

    defaultConfig {
        applicationId "com.p2p.messenger.server"
        // minSdk 28: v3 signing-key rotation (--rotation-min-sdk-version 28) requires it; Android 8.0/8.1 only check v1/v2 signatures made with the old key.
        minSdk 28
        targetSdk 34
        versionCode 43
        versionName "6.0.0a"

        ndk {
            abiFilters 'armeabi-v7a', 'arm64-v8a', 'x86_64'
        }
    }

    signingConfigs {
        // İstemcideki AYNI gerekçe: depoya girmiş sabit bir debug keystore,
        // farklı makinelerden yeniden kurulumda /data/data'nın silinmemesi
        // için (imza değişirse Android uygulamayı kaldırıp yeniden kurar ve
        // sunucunun veritabanı/onion kimliği gider).
        debug {
            storeFile file('debug.keystore')
            storePassword 'android'
            keyAlias 'androiddebugkey'
            keyPassword 'android'
        }
    }

    buildTypes {
        debug {
            signingConfig signingConfigs.debug
        }
        release {
            minifyEnabled false
            proguardFiles getDefaultProguardFile('proguard-android-optimize.txt'), 'proguard-rules.pro'
            // C5: release is NOT signed by Gradle (the tracked debug key would
            // let anyone with the repo sign an update). `sign-release.sh`
            // signs it with the private key through the v3 lineage
            // (~/.config/typeon-signing), so installs update without a wipe.
        }
    }

    compileOptions {
        sourceCompatibility JavaVersion.VERSION_17
        targetCompatibility JavaVersion.VERSION_17
    }
    kotlinOptions {
        jvmTarget = '17'
    }

    packagingOptions {
        jniLibs {
            // 16 KB sayfa hizalaması — istemcideki aynı gerekçe.
            useLegacyPackaging = false
            // `if-watch` bağımlılığının ürettiği, hizalama denetimini geçemeyen
            // yan cdylib (istemcide de dışlanıyor). Under `jniLibs`: under
            // `resources` it matched nothing and 9 copies shipped.
            // The client core (libp2p_messenger.so) is a build dependency only:
            // the server never loads it (H111).
            excludes += ["**/libif_watch*.so", "**/libp2p_messenger.so"]
        }
    }
}

dependencies {
    implementation 'androidx.appcompat:appcompat:1.6.1'
    implementation 'com.google.android.material:material:1.11.0'
    // Davet kodunun QR'ını çizmek için — istemcide de kullanılan sürüm.
    implementation 'com.google.zxing:core:3.5.1'
}

// --- Rust (typeon-server) cross-derlemesi ---
//
// İstemcideki `cargoNdkBuild` görevinin birebir eşi; tek farkı çalışma
// dizini (depo kökündeki `typeon-server/`) ve çıktı `.so`'nun adı
// (`libtypeon_server.so`).

def resolveCargoExecutable() {
    def pathEnv = System.getenv("PATH") ?: ""
    def candidates = pathEnv.split(File.pathSeparator).collect { new File(it, "cargo") }
    candidates += new File(System.getProperty("user.home"), ".cargo/bin/cargo")
    def found = candidates.find { it.exists() && it.canExecute() }
    if (found == null) {
        throw new GradleException(
            "cargo bulunamadı. rustup ile Rust kurulu olduğundan emin olun " +
            "(https://rustup.rs) — beklenen konum: " +
            "${System.getProperty('user.home')}/.cargo/bin/cargo"
        )
    }
    return found.absolutePath
}

def resolveNdkHome() {
    def fromEnv = System.getenv("ANDROID_NDK_HOME") ?: System.getenv("ANDROID_NDK_ROOT")
    if (fromEnv != null && new File(fromEnv).isDirectory()) {
        return fromEnv
    }
    def localProps = new File(rootDir, "local.properties")
    if (localProps.exists()) {
        def props = new Properties()
        localProps.withInputStream { props.load(it) }
        def sdkDir = props.getProperty("sdk.dir")
        if (sdkDir != null) {
            def ndkRoot = new File(sdkDir, "ndk")
            if (ndkRoot.isDirectory()) {
                def versions = ndkRoot.listFiles({ f -> f.isDirectory() } as FileFilter)
                if (versions != null && versions.length > 0) {
                    // Numeric, not lexicographic: "9.0.0" sorted after "30.0.x" (H110).
                    def num = { f -> f.name.tokenize(".").collect { it.isInteger() ? it.toInteger() : 0 } }
                    return versions.max { a, b ->
                        def pa = num(a), pb = num(b)
                        for (int i = 0; i < Math.max(pa.size(), pb.size()); i++) {
                            int c = (i < pa.size() ? pa[i] : 0) <=> (i < pb.size() ? pb[i] : 0)
                            if (c != 0) return c
                        }
                        0
                    }.absolutePath
                }
            }
        }
    }
    return null
}

task cargoNdkBuild(type: Exec) {
    workingDir "${rootDir}/../typeon-server"
    environment "PATH", "${System.getProperty('user.home')}/.cargo/bin${File.pathSeparator}${System.getenv('PATH') ?: ''}"
    def ndkHome = resolveNdkHome()
    if (ndkHome != null) {
        environment "ANDROID_NDK_HOME", ndkHome
        // libjxl (jpegxl-rs "vendored", via p2p_messenger_core) is built by CMake, which finds the NDK here.
        environment "ANDROID_NDK_ROOT", ndkHome
    }
    // M-161/M-167: RUSTFLAGS env, config'teki rustflags'i tamamen ezer ve sunucu
    // crate'inde .cargo/config.toml bulunmaz => 16 KB bayragini + yol maskelemeyi
    // hedef-ozel env ile burada veriyoruz. ($HOME ve proje yolu .so'ya sizmasin)
    environment.remove("RUSTFLAGS")
    environment.remove("CARGO_ENCODED_RUSTFLAGS")
    def home = System.getProperty('user.home')
    def remap = ["--remap-path-prefix=${home}=/build", "--remap-path-prefix=${rootDir.parentFile.absolutePath}=/src"]
    def page = ["-C", "link-arg=-Wl,-z,max-page-size=16384"]
    environment "CARGO_TARGET_AARCH64_LINUX_ANDROID_RUSTFLAGS", (remap + page).join(" ")
    environment "CARGO_TARGET_X86_64_LINUX_ANDROID_RUSTFLAGS", (remap + page).join(" ")
    environment "CARGO_TARGET_ARMV7_LINUX_ANDROIDEABI_RUSTFLAGS", remap.join(" ")
    // `--lib` ZORUNLU: bu crate ayrıca headless Linux daemon'ını
    // (`src/bin/typeon-server.rs`) üretiyor ve `cargo ndk build` varsayılan
    // olarak TÜM hedefleri derliyor. O binary Android'de linklenmiyor —
    // libp2p'nin `if-watch`'i `getifaddrs`e ihtiyaç duyuyor, cdylib'de sorun
    // çıkarmayan ama `-pie -nodefaultlibs` ile linklenen bir çalıştırılabilir
    // için çözülemeyen bir sembol. Zaten Android'de bir daemon binary'sine
    // ihtiyaç da yok: uygulama kütüphaneyi JNI ile çağırıyor.
    commandLine resolveCargoExecutable(), 'ndk',
            '-t', 'armeabi-v7a', '-t', 'arm64-v8a', '-t', 'x86_64',
            '-o', "${projectDir}/src/main/jniLibs",
            'build', '--release', '--lib', '--locked'
}

preBuild.dependsOn cargoNdkBuild
