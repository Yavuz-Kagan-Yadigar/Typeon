plugins {
    id 'com.android.application'
    id 'org.jetbrains.kotlin.android'
}

// TypeOn server app: a separate APK from the client.
//
// Why a separate project: the client build must not be affected by it. If both were
// modules of one Gradle project, the server's Rust crate (with its own cargo-ndk
// call) would also be added to every client build.
//
// REALISTIC DEPLOYMENT WARNING: Android can still kill a foreground service under
// memory pressure. This app is meant for a "spare phone that stays plugged in at
// home" scenario. A server that must run continuously should use the
// `typeon-server` daemon on a small VPS (see typeon-server/README.md).
android {
    namespace 'com.p2p.messenger.server'
    compileSdk 35

    defaultConfig {
        applicationId "com.p2p.messenger.server"
        // minSdk 28: v3 signing-key rotation (--rotation-min-sdk-version 28) requires it; Android 8.0/8.1 only check v1/v2 signatures made with the old key.
        minSdk 28
        targetSdk 35
        versionCode 60
        versionName "9.0.0"

        ndk {
            abiFilters 'armeabi-v7a', 'arm64-v8a', 'x86_64'
        }
    }

    signingConfigs {
                // Same reason as the client: a fixed, checked-in debug keystore, so
                // reinstalling from another machine does not wipe /data/data. If the
                // signature changes, Android uninstalls and reinstalls the app, and the
                // server's database and onion identity are lost.
        debug {
            storeFile file('debug.keystore')
            storePassword 'android'
            keyAlias 'androiddebugkey'
            keyPassword 'android'
        }
    }

    buildFeatures {
        buildConfig true
    }

    buildTypes {
        debug {
            signingConfig signingConfigs.debug
        }
        release {
            minifyEnabled false
            proguardFiles getDefaultProguardFile('proguard-android-optimize.txt'), 'proguard-rules.pro'
            // C5: release is NOT signed by Gradle (the tracked debug key would
            // let anyone with the repo sign an update). `sign-release.sh`
            // signs it with the private key through the v3 lineage
            // (~/.config/typeon-signing), so installs update without a wipe.
        }
    }

    compileOptions {
        sourceCompatibility JavaVersion.VERSION_17
        targetCompatibility JavaVersion.VERSION_17
    }
    kotlinOptions {
        jvmTarget = '17'
    }

    packagingOptions {
        jniLibs {
                        // 16 KB page alignment, same reason as the client.
            useLegacyPackaging = false
                        // A side cdylib from the `if-watch` dependency that fails the alignment
                        // check (the client excludes it too). Under `jniLibs`: under `resources`
                        // it matched nothing and 9 copies shipped.
                        // The client core (libp2p_messenger.so) is a build dependency only: the
                        // server never loads it.
            excludes += ["**/libif_watch*.so", "**/libp2p_messenger.so"]
        }
    }
}

dependencies {
    implementation 'androidx.appcompat:appcompat:1.6.1'
    implementation 'com.google.android.material:material:1.11.0'
        // Used to draw the invite code's QR, same version as the client.
    implementation 'com.google.zxing:core:3.5.1'
}

// --- Rust (typeon-server) cross-build ---
//
// Counterpart of the `cargoNdkBuild` task in the client. The only differences are
// the working directory (`typeon-server/` at the repo root) and the output `.so`
// name (`libtypeon_server.so`).

def resolveCargoExecutable() {
    def pathEnv = System.getenv("PATH") ?: ""
    def candidates = pathEnv.split(File.pathSeparator).collect { new File(it, "cargo") }
    candidates += new File(System.getProperty("user.home"), ".cargo/bin/cargo")
    def found = candidates.find { it.exists() && it.canExecute() }
    if (found == null) {
        throw new GradleException(
            "cargo bulunamadı. rustup ile Rust kurulu olduğundan emin olun " +
            "(https://rustup.rs) — beklenen konum: " +
            "${System.getProperty('user.home')}/.cargo/bin/cargo"
        )
    }
    return found.absolutePath
}

def resolveNdkHome() {
    def fromEnv = System.getenv("ANDROID_NDK_HOME") ?: System.getenv("ANDROID_NDK_ROOT")
    if (fromEnv != null && new File(fromEnv).isDirectory()) {
        return fromEnv
    }
    def localProps = new File(rootDir, "local.properties")
    if (localProps.exists()) {
        def props = new Properties()
        localProps.withInputStream { props.load(it) }
        def sdkDir = props.getProperty("sdk.dir")
        if (sdkDir != null) {
            def ndkRoot = new File(sdkDir, "ndk")
            if (ndkRoot.isDirectory()) {
                def versions = ndkRoot.listFiles({ f -> f.isDirectory() } as FileFilter)
                if (versions != null && versions.length > 0) {
                                        // Numeric, not lexicographic: "9.0.0" sorted after "30.0.x".
                    def num = { f -> f.name.tokenize(".").collect { it.isInteger() ? it.toInteger() : 0 } }
                    return versions.max { a, b ->
                        def pa = num(a), pb = num(b)
                        for (int i = 0; i < Math.max(pa.size(), pb.size()); i++) {
                            int c = (i < pa.size() ? pa[i] : 0) <=> (i < pb.size() ? pb[i] : 0)
                            if (c != 0) return c
                        }
                        0
                    }.absolutePath
                }
            }
        }
    }
    return null
}

task cargoNdkBuild(type: Exec) {
    workingDir "${rootDir}/../typeon-server"
    environment "PATH", "${System.getProperty('user.home')}/.cargo/bin${File.pathSeparator}${System.getenv('PATH') ?: ''}"
    def ndkHome = resolveNdkHome()
    if (ndkHome != null) {
        environment "ANDROID_NDK_HOME", ndkHome
        // libjxl (jpegxl-rs "vendored", via p2p_messenger_core) is built by CMake, which finds the NDK here.
        environment "ANDROID_NDK_ROOT", ndkHome
    }
        // RUSTFLAGS in the environment overrides the rustflags in the config completely,
        // and the server crate has no .cargo/config.toml. So the 16 KB flag and path
        // masking are passed here as target-specific env vars. This keeps $HOME and the
        // project path out of the .so.
    environment.remove("RUSTFLAGS")
    environment.remove("CARGO_ENCODED_RUSTFLAGS")
    def home = System.getProperty('user.home')
    def remap = ["--remap-path-prefix=${home}=/build", "--remap-path-prefix=${rootDir.parentFile.absolutePath}=/src"]
    def page = ["-C", "link-arg=-Wl,-z,max-page-size=16384"]
    environment "CARGO_TARGET_AARCH64_LINUX_ANDROID_RUSTFLAGS", (remap + page).join(" ")
    environment "CARGO_TARGET_X86_64_LINUX_ANDROID_RUSTFLAGS", (remap + page).join(" ")
    environment "CARGO_TARGET_ARMV7_LINUX_ANDROIDEABI_RUSTFLAGS", remap.join(" ")
        // `--lib` is REQUIRED: this crate also builds the headless Linux daemon
        // (`src/bin/typeon-server.rs`), and `cargo ndk build` builds ALL targets by
        // default. That binary is not linked on Android. libp2p's `if-watch` needs
        // `getifaddrs`, a symbol that cannot be resolved in a PIE executable linked with
        // `-nodefaultlibs`, though it causes no problem in a cdylib. Android also has no
        // use for a daemon binary: the app calls the library through JNI.
    commandLine resolveCargoExecutable(), 'ndk',
            '-t', 'armeabi-v7a', '-t', 'arm64-v8a', '-t', 'x86_64',
            '-o', "${projectDir}/src/main/jniLibs",
            'build', '--release', '--lib', '--locked'
}

preBuild.dependsOn cargoNdkBuild
