# Flatpak manifest for the Typeon Linux desktop client.
#
# Why Flatpak: the app is built on GTK4 and libadwaita. Packaging those by hand into
# an AppImage (gdk-pixbuf loader cache, compiled GSettings schemas, icon theme) is
# fragile. The GNOME runtime provides all of them at the right versions.
#
# The build runs INSIDE the sandbox, not on the host. The host runs openSUSE with
# GTK 4.22 and the runtime has 4.20. Building on the host and running in the runtime
# would risk symbol mismatches.
app-id: com.p2p.messenger.Typeon
runtime: org.gnome.Platform
runtime-version: '49'
sdk: org.gnome.Sdk
sdk-extensions:
  - org.freedesktop.Sdk.Extension.rust-stable
command: typeon

finish-args:
    # libp2p + Tor: without the network the app has no purpose.
  - --share=network
  - --share=ipc
  - --socket=wayland
  - --socket=fallback-x11
    # GPU (VA-API video encode/decode) and camera for video calls. Flatpak has no
    # camera-only device type (1.18.3 rejects `v4l2`: "valid types are dri, all, kvm,
    # shm, input, usb"), so the camera needs `--device=all` (owner decision). Narrows
    # to `--device=dri` only once calls open the camera through the camera portal
    # (`pipewiresrc`) instead of `v4l2src`.
  - --device=all
    # Voice message recording and playback, and call audio.
  - --socket=pulseaudio
    # CRITICAL: the vault key is kept in the system keyring, and the app does NOT start
    # without a keyring (see src/keyring.rs).
  - --talk-name=org.freedesktop.secrets
    # Self-update (src/update.rs): `flatpak-spawn --host flatpak install --bundle` of the
    # verified release bundle, then `flatpak run` again. This lets the app run host commands (a sandbox
    # hole); it is the price of updating without the user.
  - --talk-name=org.freedesktop.Flatpak
    # The well-known name alone is NOT enough. Verified on a real device: with only
    # `org.freedesktop.secrets` granted, the app refused to start, reporting "No system
    # keyring found — Neither KDE Wallet nor GNOME Keyring is installed".
    #
    # The reason is in the file header note of `keyring.rs`. On KDE,
    # `org.freedesktop.secrets` often cannot be started over D-Bus by itself. So
    # `ensure_available` first activates the wallet under its real name
    # (`StartServiceByName`). The Flatpak D-Bus proxy also hides names it does not allow
    # from the `ListActivatableNames` result, so the app saw no candidate and concluded
    # that nothing was installed. All four backend names are in the `BACKEND_NAMES` list.
  - --talk-name=org.kde.secretservicecompat
  - --talk-name=org.kde.kwalletd6
  - --talk-name=org.kde.kwalletd5
  - --talk-name=org.gnome.keyring
    # File open and save go through the portal (gtk::FileDialog), so the app does NOT
    # request broad filesystem access.

modules:
  - name: typeon
    buildsystem: simple
    build-options:
      append-path: /usr/lib/sdk/rust-stable/bin
      env:
        CARGO_HOME: /run/build/typeon/cargo
        CARGO_TERM_COLOR: never
            # Network is open so cargo can fetch dependencies inside the sandbox.
            # (The alternative would be vendoring the sources into the repo with `cargo vendor`.)
      build-args:
        - --share=network
    build-commands:
        # --locked: a manifest edit not mirrored in Cargo.lock fails the build
        # instead of pulling the newest matching crates into a release.
      - cargo build --release --locked --manifest-path Linux/Cargo.toml
      - install -Dm755 Linux/target/release/typeon /app/bin/typeon
        # Tor bridge PTs (tools/fetch-pt-binaries.sh -> pt-bin/, gitignored). The core looks for them next
        # to /app/bin/typeon. Missing: the build goes on, and Snowflake / obfs4 show "not available".
      - 'for pt in lyrebird; do if [ -f pt-bin/linux-x86_64/$pt ]; then install -Dm755 pt-bin/linux-x86_64/$pt /app/bin/$pt; else echo "warning: pt-bin/linux-x86_64/$pt missing" >&2; fi; done'
      - install -Dm644 Linux/data/com.p2p.messenger.Typeon.desktop /app/share/applications/com.p2p.messenger.Typeon.desktop
      - install -Dm644 Linux/data/com.p2p.messenger.Typeon.metainfo.xml /app/share/metainfo/com.p2p.messenger.Typeon.metainfo.xml
      - install -Dm644 Linux/data/com.p2p.messenger.Typeon.svg /app/share/icons/hicolor/scalable/apps/com.p2p.messenger.Typeon.svg
    sources:
      - type: dir
        path: ../..
        skip:
          - .git
          # Local tooling state and release output: not sources, and they
          # must not end up in a build cache.
          - .claude
          - .crush
          - dist
          - reviews
          - Linux/target
          - Linux/target-sdk
                    # `Linux/packaging` is skipped ENTIRELY, not only its build outputs. The source
                    # is `../..`, which includes the manifest itself. If it were not skipped,
                    # changing one line of the manifest would change the source hash, flatpak-builder's
                    # cache would miss, and the whole Rust dependency tree would be rebuilt from
                    # scratch (about 15 minutes) just to edit finish-args. This happened once.
          - Linux/packaging
          - p2p_messenger_android/app/build
          - p2p_messenger_android/app/src/main/cpp/rust/target
          - p2p_messenger_android_server/app/build
          - typeon-server/target
          - plasticity-26.1.3-2.x86_64.rpm
          - ChatActivity-recovered
