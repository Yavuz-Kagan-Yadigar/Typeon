plugins {
    id 'com.android.application'
    id 'org.jetbrains.kotlin.android'
}

android {
    namespace 'com.p2p.messenger'
    compileSdk 34

    defaultConfig {
        applicationId "com.p2p.messenger"
        // minSdk 28: v3 signing-key rotation (--rotation-min-sdk-version 28) requires it; Android 8.0/8.1 only check v1/v2 signatures made with the old key.
        minSdk 28
        targetSdk 34
        versionCode 58
        versionName "7.4.0"

        testInstrumentationRunner "androidx.test.runner.AndroidJUnitRunner"

        ndk {
            abiFilters 'armeabi-v7a', 'arm64-v8a', 'x86_64'
        }
    }

        // Fixed, checked-in debug key (app/debug.keystore) instead of each machine's
        // own auto-generated ~/.android/debug.keystore. Without it, a rebuild on
        // another machine, or after that file is regenerated, produces an APK with a
        // different signature. `adb install -r` and Play cannot update across a
        // signature change, so the app must be uninstalled first. That wipes
        // /data/data (contacts, identity keys), and previously paired contacts must be
        // paired again, even though nothing else about them changed.
    signingConfigs {
        debug {
            storeFile file('debug.keystore')
            storePassword 'android'
            keyAlias 'androiddebugkey'
            keyPassword 'android'
        }
    }

    buildTypes {
        debug {
            signingConfig signingConfigs.debug
        }
        release {
            minifyEnabled false
            proguardFiles getDefaultProguardFile('proguard-android-optimize.txt'), 'proguard-rules.pro'
                        // The release build is NOT signed by Gradle. Signing it with the tracked
                        // debug key would let anyone with the repo sign an update. `sign-release.sh`
                        // signs it with the private key through the v3 lineage
                        // (~/.config/typeon-signing), so installs update without a wipe.
        }
    }

    compileOptions {
        sourceCompatibility JavaVersion.VERSION_17
        targetCompatibility JavaVersion.VERSION_17
    }

    kotlinOptions {
        jvmTarget = '17'
    }

    buildFeatures {
        viewBinding true
    }

    packagingOptions {
        jniLibs {
                        // AGP 8.5+ and build-tools zipalign uncompressed native libs to the page
                        // size automatically. Keep this explicit so it does not silently regress
                        // if legacy packaging is ever re-enabled.
            useLegacyPackaging = false
                        // `if-watch` (a libp2p dependency, used for network-interface change
                        // detection) declares `crate-type = ["cdylib", "lib"]` in its own
                        // Cargo.toml. So cargo-ndk's build also produces a `libif_watch-*.so` side
                        // artifact next to the real libp2p_messenger.so. Nothing loads it: no
                        // System.loadLibrary call references it. It was dead weight, and it also
                        // failed the 16 KB page-size check. So it is excluded, rather than
                        // aligning a library the app never uses.
            excludes += ["**/libif_watch*.so"]
        }
    }
}

dependencies {
    implementation 'androidx.core:core-ktx:1.12.0'
    implementation 'androidx.appcompat:appcompat:1.6.1'
    implementation 'com.google.android.material:material:1.11.0'
    implementation 'androidx.constraintlayout:constraintlayout:2.1.4'
    implementation 'androidx.lifecycle:lifecycle-runtime-ktx:2.7.0'
    implementation 'androidx.activity:activity-ktx:1.8.2'
    implementation 'androidx.fragment:fragment-ktx:1.6.2'

        // AndroidX's full emoji grid: categories, search, recently used, and skin tone
        // variants. No public Android API lets an app open the system keyboard's emoji
        // panel directly. This widget is the official equivalent, and it uses the
        // platform's own emoji data (emoji2).
    implementation 'androidx.emoji2:emoji2-emojipicker:1.4.0'
        // Build fix that came with the emoji picker. Guava was already on the runtime
        // classpath but not on the compile classpath. `listenablefuture` is pinned to
        // the empty `9999.0-empty-to-avoid-conflict-with-guava` version so it does not
        // clash with guava. Result: the `ListenableFuture` class could not be found at
        // compile time, and the two CameraX screens (QrScan and CameraCapture) broke.
        // Declaring guava explicitly puts it on both classpaths. The artifact was
        // already packaged, so there is no extra size cost. (Pinning `listenablefuture`
        // to 1.0 was also tried. It failed with duplicate-class errors, because both
        // artifacts ship the same class.)
    implementation 'com.google.guava:guava:31.0.1-jre'

    // Navigation
    def nav_version = "2.7.6"
    implementation "androidx.navigation:navigation-fragment-ktx:$nav_version"
    implementation "androidx.navigation:navigation-ui-ktx:$nav_version"

    // CameraX for QR
    // 1.3.1's prebuilt libimage_processing_util_jni.so predates 16 KB page
    // size support; 1.4.1 ships a 16 KB-aligned build of that library.
    def camerax_version = "1.4.1"
    implementation "androidx.camera:camera-core:$camerax_version"
    implementation "androidx.camera:camera-camera2:$camerax_version"
    implementation "androidx.camera:camera-lifecycle:$camerax_version"
    implementation "androidx.camera:camera-view:$camerax_version"

    // ZXing for QR decoding
    implementation 'com.google.zxing:core:3.5.1'

    // Coroutines
    implementation 'org.jetbrains.kotlinx:kotlinx-coroutines-android:1.7.3'

        // Periodic background scan, once an hour, for the persistent retry queue.
        // WorkManager runs it through the OS, batched with other apps' jobs. That is
        // much more battery-friendly than a custom AlarmManager or wakelock loop.
    implementation 'androidx.work:work-runtime-ktx:2.9.0'

    testImplementation 'junit:junit:4.13.2'
    androidTestImplementation 'androidx.test.ext:junit:1.1.5'
    androidTestImplementation 'androidx.test.espresso:espresso-core:3.5.1'
}

// Build the Rust core via cargo-ndk and drop the resulting .so files into jniLibs,
// so System.loadLibrary("p2p_messenger") can find them.
// Requires: cargo install cargo-ndk, and the Android NDK on PATH or in ANDROID_NDK_HOME.
// Android Studio, when started from the desktop menu or launcher (or from the
// Flatpak sandbox), is usually NOT a login shell. So ~/.bashrc and ~/.profile never
// run, ~/.cargo/bin is not added to PATH, and Gradle cannot find `cargo`
// (error=2: No such file or directory). A terminal `cargo` works because the
// terminal's PATH is set up by .bashrc.
// Fix: find the full cargo path ourselves. Search PATH first, then fall back to the
// standard rustup location (~/.cargo/bin/cargo).
def resolveCargoExecutable() {
    def pathEnv = System.getenv("PATH") ?: ""
    def candidates = pathEnv.split(File.pathSeparator).collect { new File(it, "cargo") }
    candidates += new File(System.getProperty("user.home"), ".cargo/bin/cargo")
    def found = candidates.find { it.exists() && it.canExecute() }
    if (found == null) {
        throw new GradleException(
            "cargo bulunamadı. rustup ile Rust kurulu olduğundan emin olun " +
            "(https://rustup.rs) — beklenen konum: " +
            "${System.getProperty('user.home')}/.cargo/bin/cargo"
        )
    }
    return found.absolutePath
}

// ANDROID_NDK_HOME is resolved here by hand for the same reason: Android Studio's
// process may not inherit the user's shell environment variables. The environment
// variable is checked first. If it is not set, the newest version installed under
// ndk/ in the sdk.dir from local.properties is picked automatically.
def resolveNdkHome() {
    def fromEnv = System.getenv("ANDROID_NDK_HOME") ?: System.getenv("ANDROID_NDK_ROOT")
    if (fromEnv != null && new File(fromEnv).isDirectory()) {
        return fromEnv
    }
    def localProps = new File(rootDir, "local.properties")
    if (localProps.exists()) {
        def props = new Properties()
        localProps.withInputStream { props.load(it) }
        def sdkDir = props.getProperty("sdk.dir")
        if (sdkDir != null) {
            def ndkRoot = new File(sdkDir, "ndk")
            if (ndkRoot.isDirectory()) {
                def versions = ndkRoot.listFiles({ f -> f.isDirectory() } as FileFilter)
                if (versions != null && versions.length > 0) {
                                        // Numeric, not lexicographic: "9.0.0" sorted after "30.0.x".
                    def num = { f -> f.name.tokenize(".").collect { it.isInteger() ? it.toInteger() : 0 } }
                    return versions.max { a, b ->
                        def pa = num(a), pb = num(b)
                        for (int i = 0; i < Math.max(pa.size(), pb.size()); i++) {
                            int c = (i < pa.size() ? pa[i] : 0) <=> (i < pb.size() ? pb[i] : 0)
                            if (c != 0) return c
                        }
                        0
                    }.absolutePath
                }
            }
        }
    }
    return null
}

task cargoNdkBuild(type: Exec) {
    workingDir "${projectDir}/src/main/cpp/rust"
    environment "PATH", "${System.getProperty('user.home')}/.cargo/bin${File.pathSeparator}${System.getenv('PATH') ?: ''}"
    def ndkHome = resolveNdkHome()
    if (ndkHome != null) {
        environment "ANDROID_NDK_HOME", ndkHome
        // libjxl (jpegxl-rs "vendored") is built by CMake, which finds the NDK here.
        environment "ANDROID_NDK_ROOT", ndkHome
    }
        // RUSTFLAGS in the environment overrides the rustflags in the config completely,
        // and the server crate has no .cargo/config.toml. So the 16 KB flag and path
        // masking are passed here as target-specific env vars. This keeps $HOME and the
        // project path out of the .so.
    environment.remove("RUSTFLAGS")
    environment.remove("CARGO_ENCODED_RUSTFLAGS")
    def home = System.getProperty('user.home')
    def remap = ["--remap-path-prefix=${home}=/build", "--remap-path-prefix=${rootDir.parentFile.absolutePath}=/src"]
    def page = ["-C", "link-arg=-Wl,-z,max-page-size=16384"]
    environment "CARGO_TARGET_AARCH64_LINUX_ANDROID_RUSTFLAGS", (remap + page).join(" ")
    environment "CARGO_TARGET_X86_64_LINUX_ANDROID_RUSTFLAGS", (remap + page).join(" ")
    environment "CARGO_TARGET_ARMV7_LINUX_ANDROIDEABI_RUSTFLAGS", remap.join(" ")
        // The DebugDbKey JNI export exists only in a debug build (one .so is built per
        // Gradle run, for the variant requested). Opt-in: debug-hooks are enabled only
        // for an explicit debug-flavored invocation. The requested task list must be
        // non-empty, at least one task name must contain 'debug', and none may contain
        // 'release' (case-insensitive). assemble/build/bundle and studio sync run
        // WITHOUT them.
    def taskNames = gradle.startParameter.taskNames
    def taskNamesLower = taskNames.collect { it.toLowerCase() }
    def debugOnly = !taskNames.isEmpty() && taskNamesLower.any { it.contains('debug') } && taskNamesLower.every { !it.contains('release') }
    commandLine resolveCargoExecutable(), 'ndk',
            '-t', 'armeabi-v7a', '-t', 'arm64-v8a', '-t', 'x86_64',
            '-o', "${projectDir}/src/main/jniLibs",
            'build', '--release', '--locked',
            *(debugOnly ? ['--features', 'debug-hooks'] : [])
}

preBuild.dependsOn cargoNdkBuild
