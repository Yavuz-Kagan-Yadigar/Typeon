[package]
name = "p2p_messenger_core"
version = "8.0.0"
edition = "2021"
license = "GPL-3.0-or-later"

[lib]
# "rlib" is included so the Linux desktop client (see `Linux/` at the repo root)
# can link this core directly as a path dependency (see the `api` module).
# A cdylib or staticlib cannot be `use`d by another Rust crate, so rlib is needed.
# Android is unaffected: cargo-ndk still builds the cdylib.
crate-type = ["cdylib", "staticlib", "rlib"]
name = "p2p_messenger"

[features]
# Debug-only JNI exports (DebugDbKey). Off by default; debug variant only.
debug-hooks = []

[dependencies]
# Shared crypto core (identity, ratchet, packet, server_proto, server_seal).
# These modules moved to `typeon-crypto`. `lib.rs` re-exports them with `pub use`,
# so this core and any other consumer share the same code. The versions below
# must match the crypto crates exactly.
typeon-crypto = { path = "../../../../../../typeon-crypto" }

# Cryptography
ring = "0.17"
# NOTE: moved from pqcrypto-kyber/pqcrypto-dilithium to RustCrypto's ml-kem and
# ml-dsa crates. The old crates are unmaintained (RUSTSEC-2024-0381,
# RUSTSEC-2024-0380), and they are not byte-compatible with the final FIPS 203/204
# standards (they followed the PQClean round-3 Kyber/Dilithium drafts). ml-dsa
# requires >=0.1.0-rc.4: rc.2 and rc.3 carry the signature malleability issue
# GHSA-5x2r-hc65-25f9, where repeated hint indices were accepted as valid signatures.
#
# ml-kem 0.3 (stable, constant-time hardening of 0.3.3/0.3.4) re-exports the
# kem 0.3 traits at its root, so `kem` is no direct dependency any more. Like
# ml-dsa, it draws from its own system RNG (`getrandom` feature, getrandom 0.4),
# so its rand_core 0.10 never meets the rand_core 0.6 of x25519/ed25519-dalek.
# Decapsulation keys are stored as their 64-byte seed; the 3168-byte expanded
# form of ml-kem 0.2 still loads (`ratchet::mlkem_dk_from_bytes`).
# Security-audit fix: the `zeroize` feature is enabled in all four crates (ml-kem,
# ml-dsa, x25519-dalek, ed25519-dalek). Long-term identity secret keys (DeviceKeys)
# and each ratchet session's own X25519/Kyber secret pair
# (DeviceRatchetState.own_x25519_secret / own_kyber_secret) are overwritten with
# zeros on drop, not just freed. See SECURITY.md, section 6 (local storage) for
# the key handling rules.
# Before this, these crates were built without the feature, so secret key bytes
# were released with a plain Rust drop and never overwritten. If process memory
# were readable (for example through another device-level flaw), those bytes
# could still be there.
ml-kem = { version = "0.3.4", features = ["zeroize", "getrandom"] }
ml-dsa = { version = "0.1.2", features = ["getrandom", "zeroize"] }
chacha20poly1305 = "0.10"
rand = "0.8"
sha2 = "0.10"
sha3 = "0.10"
hkdf = "0.12"
# "Hi-res" image attachments: lossless JPEG XL out (zune-jpegxl), and a
# received one opened as PNG for the viewers (jxl-oxide, png). All pure Rust,
# no C++ for the NDK or the Flatpak SDK.
zune-jpegxl = "0.5"
zune-core = "0.5"
jxl-oxide = { version = "0.12", default-features = false }
png = "0.18"
# Stickers: lossy JPEG XL (libjxl, built from source by the "vendored" feature;
# needs cmake + a C++ toolchain, cargo-ndk provides it for Android).
jpegxl-rs = { version = "0.16", default-features = false, features = ["vendored"] }
# Security-audit fix: the recovery file (which carries all long-term secret keys)
# now derives its key from the passphrase with Argon2id. It used HKDF-SHA256 before,
# a single HMAC with no protection against offline brute force. Argon2id is
# memory-hard and pure Rust (no C toolchain needed, so cross-compiles are unaffected).
argon2 = "0.5"
x25519-dalek = { version = "2", features = ["static_secrets", "zeroize"] }
ed25519-dalek = { version = "2", features = ["rand_core", "zeroize"] }
hex = "0.4"
base32 = "0.5"
serde = { version = "1.0", features = ["derive"] }
# Write byte fields in CBOR as byte strings, not integer arrays (about 1.9x smaller).
serde_bytes = "0.11"
serde_json = "1.0"
ciborium = "0.2"
zeroize = "1.7"
uuid = { version = "1.6", features = ["v4", "serde"] }

# Networking (libp2p)
# Relay is enabled; dcutr and autonat were removed later. The transport is onion
# only (see SECURITY.md, section 5, "Cross-network connectivity").
# Devices on different networks reach each other through relays.
# Spec §4.3 allowed an optional Circuit Relay v2 service for Node mode,
# but it was never implemented.
#
# Connection liveness testing: a connection is checked actively, and reconnects
# happen automatically. Before, the only way to confirm a connection still worked
# was a failed write over it (for example, sending a message). A half-open
# connection (the network interface changed, NAT or the firewall dropped an idle
# connection silently, the device woke from sleep) could go unnoticed for minutes.
# libp2p's own `is_connected()` still reports such a connection as up, because TCP
# has not yet seen a reset or timeout.
# This used to be done with the stock "ping" feature (libp2p::ping). It is now done
# by the custom `keepalive` in lib.rs (request-response based, see `KeepAliveState`).
# Reason: the stock ping applies one fixed interval to all connections. Battery work
# needed the interval to grow once a connection is stable, and the stock ping does
# not support that. The "ping" feature is removed because nothing uses it.
# "request-response" and "cbor" stay, since `file_chunks` already used them.
libp2p = { version = "0.53", features = ["tcp", "noise", "yamux", "kad", "identify", "tokio", "macros", "dns", "request-response", "cbor", "relay"] }
tokio = { version = "1", features = ["rt-multi-thread", "macros", "sync", "time"] }
# Call media: one long-lived stream per peer instead of a request/response
# substream (and multistream round trip) per 60 ms audio packet. See call.rs.
libp2p-stream = "=0.1.0-alpha.1"
futures = "0.3"

# Database
# NOTE: rusqlite was raised from 0.30 to 0.32, because arti (tor-dirmgr) depends
# unconditionally on rusqlite 0.32. Two libsqlite3-sys versions (both with
# `links = "sqlite3"`) make cargo refuse to build with "multiple packages link to
# sqlite3". Aligning on one version fixed that. The API used (Connection, execute,
# query_map, params, prepare) did not change between 0.30 and 0.32.
# SQLCipher: the whole client database is encrypted (see `init_db`). OpenSSL
# is built from source so Android (NDK), desktop and the Flatpak SDK need no
# system libcrypto.
rusqlite = { version = "0.32", features = ["bundled-sqlcipher-vendored-openssl"] }

# Tor (onion service). Added so devices behind CGNAT can reach each other (see
# SECURITY.md, section 5, "Tor onion services"). rustls is used instead of
# native-tls, to avoid cross-compiling OpenSSL. arti's rustls uses `ring`, which
# this project already cross-compiles. onion-service-service = host a service;
# onion-service-client + keymgr = a persistent .onion address.
arti-client = { version = "0.24", default-features = false, features = ["tokio", "rustls", "onion-service-client", "onion-service-service", "compression", "keymgr"] }
tor-hsservice = "0.24"
tor-cell = "0.24"
# Inbound BEGIN port check (`IncomingStreamRequest`). Same version arti pulls in.
tor-proto = { version = "0.24", features = ["hs-service"] }
tor-config = "0.24"
tor-rtcompat = { version = "0.24", features = ["tokio", "rustls"] }
# Self-update (update.rs): HTTPS to GitHub over a Tor stream. rustls and futures-rustls are the
# versions arti already pulls in; webpki-roots is the root store (no OS store on every platform).
rustls = { version = "0.23", default-features = false, features = ["ring", "std", "tls12"] }
futures-rustls = { version = "0.26", default-features = false }
webpki-roots = "1"

# Android JNI
jni = "0.21"
android_logger = "0.13"
log = "0.4"
# `log` feature: with no tracing subscriber, arti's `tracing` events become `log` records, so a debug APK shows them.
tracing = { version = "0.1", features = ["log"] }
lazy_static = "1.4"
# CLOCK_BOOTTIME for `mono_ms` (timers keep counting through suspend).
libc = "0.2"

[profile.release]
# opt-level "s" optimizes for size. Speed was traded for size. Crypto, Tor and
# media are CPU-bound during use. Compare BatteryLog against "z" after a normal day.
opt-level = "s"
lto = true
codegen-units = 1
strip = true

# TypeOn patch of tor-hsservice 0.24: stop re-uploading the onion descriptor
# every time an intro circuit is rebuilt (see vendor/tor-hsservice, "TypeOn patch").
[patch.crates-io]
tor-hsservice = { path = "vendor/tor-hsservice" }
tor-netdir = { path = "vendor/tor-netdir" }
