[package]
name = "p2p_messenger_core"
version = "0.2.0"
edition = "2021"

[lib]
# "rlib" EKLENDİ: Linux masaüstü istemcisi (bkz. depo kökündeki `Linux/`) bu
# çekirdeği bir path bağımlılığı olarak DOĞRUDAN linkler (bkz. `api` modülü) —
# cdylib/staticlib bir Rust crate'i tarafından `use` edilemez, rlib gerekir.
# Android tarafı için değişen bir şey yok: cargo-ndk hâlâ cdylib'i üretir.
crate-type = ["cdylib", "staticlib", "rlib"]
name = "p2p_messenger"

[dependencies]
# Paylaşılan kripto çekirdeği (identity/ratchet/packet/server_proto/server_seal).
# Bu modüller buradan `typeon-crypto`'ya taşındı; `lib.rs` onları `pub use` ile
# yeniden yayımlar, böylece hem bu çekirdek hem de tarayıcı (wasm) tarafı AYNI
# kodu kullanır. Sürümler aşağıdaki kripto crate'leriyle birebir aynı olmalı.
typeon-crypto = { path = "../../../../../../typeon-crypto" }

# Cryptography
ring = "0.17"
# NOT: pqcrypto-kyber/pqcrypto-dilithium yerine RustCrypto'nun ml-kem/ml-dsa
# crate'lerine geçildi — eskiler artık bakımsız (RUSTSEC-2024-0381,
# RUSTSEC-2024-0380) ve gerçek FIPS 203/204 standardıyla bayt-uyumsuz
# (PQClean'in round-3 taslak Kyber/Dilithium'una dayanıyorlardı). ml-dsa
# için >=0.1.0-rc.4 ZORUNLU: rc.2/rc.3 GHSA-5x2r-hc65-25f9 imza malleability
# açığını taşıyor (tekrarlanan hint index'li sahte imzalar kabul ediliyordu).
#
# ml-kem'in Decapsulate/Encapsulate trait'leri kendi kökünde değil, ayrı
# bir `kem` crate'inden geliyor (ml-kem bunu `pub use ::kem::{...}` ile
# sadece `ml_kem::kem` alt modülünde, kökte DEĞİL re-export ediyor) — bu
# yüzden `kem` doğrudan bağımlılık olarak eklendi.
#
# ml-kem'in rand_core sürümü (0.6.4) ile x25519-dalek/ed25519-dalek'in
# kullandığı rand_core (0.6, rand 0.8 üzerinden) AYNI majör sürüm — gerçekte
# bir çakışma YOK, `rand::rngs::OsRng` doğrudan ml-kem'in `CryptoRngCore`
# parametrelerine geçirilebiliyor. ml-kem'in "getrandom" diye bir feature'ı
# YOK (parametresiz üretim desteklemiyor, RNG her zaman elle verilir).
# ml-dsa ise crypto-common'ın `Generate` trait'i üzerinden gerçekten
# parametresiz `generate()` sunuyor (`getrandom` feature'ı sayesinde,
# içeride kendi ambient RNG'sini kullanır) — bu yüzden ml-dsa tarafında
# hâlâ `SigningKey::generate()` (parametresiz) kullanılıyor.
# Spec dışı, güvenlik denetimi düzeltmesi: "zeroize" feature'ı dört crate'te
# de (ml-kem/ml-dsa/x25519-dalek/ed25519-dalek) AÇILDI — bu, uzun-vadeli
# kimlik secret key'lerinin (DeviceKeys) VE her ratchet oturumunun kendi
# X25519/Kyber secret key çiftinin (DeviceRatchetState.own_x25519_secret/
# own_kyber_secret) bellekten düşürülürken (Drop) otomatik olarak sıfırla
# ÜZERİNE YAZILMASINI sağlar (bkz. SECURITY.md "Bellekte anahtar hijyeni").
# Önceden bu crate'ler bu feature'sız derleniyordu — secret key baytları
# normal Rust `drop` ile (yani hiçbir üzerine yazma olmadan) bellekten
# çıkıyordu; process belleği bir şekilde okunabilseydi (ör. ayrı bir cihaz
# açığı) bu baytlar hâlâ orada bulunabilirdi.
ml-kem = { version = "0.2", features = ["zeroize"] }
kem = "=0.3.0-pre.0"
ml-dsa = { version = "0.1.1", features = ["getrandom", "zeroize"] }
chacha20poly1305 = "0.10"
rand = "0.8"
sha2 = "0.10"
sha3 = "0.10"
hkdf = "0.12"
# Spec dışı, güvenlik denetimi düzeltmesi: kurtarma dosyası (tüm uzun-vadeli
# secret key'leri taşır) parola-tabanlı anahtar türetmesi için ARTIK
# Argon2id kullanıyor — önceden HKDF-SHA256 (tek bir HMAC, çevrimdışı
# brute-force'a karşı korumasız) kullanılıyordu. Argon2id memory-hard,
# saf-Rust (C toolchain gerektirmez, cross-compile'ı etkilemez).
argon2 = "0.5"
x25519-dalek = { version = "2", features = ["static_secrets", "zeroize"] }
ed25519-dalek = { version = "2", features = ["rand_core", "zeroize"] }
hex = "0.4"
base32 = "0.5"
serde = { version = "1.0", features = ["derive"] }
# Bayt alanları CBOR'da tam sayı dizisi yerine bayt bloğu olarak yazılsın (~1.9x küçük).
serde_bytes = "0.11"
serde_json = "1.0"
ciborium = "0.2"
zeroize = "1.7"
uuid = { version = "1.6", features = ["v4", "serde"] }

# Networking (libp2p)
# Spec dışı, güvenlik denetimi devamı: "relay"/"dcutr"/"autonat" eklendi —
# farklı ağlardaki (NAT arkasındaki) iki cihazın birbirine ulaşabilmesi için
# (bkz. SECURITY.md "Cross-network connectivity" notu). Spec §4.3 zaten Node
# modu için "isteğe bağlı Circuit Relay v2 hizmeti" öngörmüştü, ama hiçbir
# zaman implemente edilmemişti.
# Spec dışı, kullanıcı isteği ("connection testing and re-connecting
# automatically should be better", sonra pil sağlamlığı düzeltmesi): aktif
# bağlantı canlılık testi. Önceden bu uygulamanın bir bağlantının hâlâ
# GERÇEKTEN çalışır durumda olduğunu doğrulamasının TEK yolu, o bağlantı
# üzerinden bir yazma denemesinin başarısız olmasıydı (ör. bir mesaj
# göndermeye çalışmak) — bu, "yarı açık" (half-open) bir bağlantıyı (ağ
# arayüzü değişti, NAT/güvenlik duvarı boşta bağlantıyı sessizce düşürdü,
# cihaz uykudan döndü) DAKİKALARCA fark edilmeden bırakabilirdi, çünkü
# libp2p'nin kendi `is_connected()` bookkeeping'i böyle bir durumda hâlâ
# "bağlı" der (TCP katmanı henüz bir RST/timeout görmedi). Bu ÖNCEDEN stok
# "ping" feature'ıyla (libp2p::ping) yapılıyordu; artık lib.rs'teki ÖZEL
# `keepalive` (request-response tabanlı, bkz. `P2PBehaviour.keepalive`/
# `KeepAliveState`) davranışıyla yapılıyor — sebep, stok ping'in TÜM
# bağlantılara tek bir SABİT aralık uygulaması (pil sağlamlığı düzeltmesi:
# bir bağlantı stabilize olunca aralık genişletilebilsin istendi, stok ping
# bunu desteklemiyor). "ping" feature'ı artık kullanılmadığından kaldırıldı,
# "request-response"/"cbor" zaten `file_chunks` için buradaydı.
libp2p = { version = "0.53", features = ["tcp", "noise", "yamux", "gossipsub", "kad", "identify", "mdns", "tokio", "macros", "dns", "request-response", "cbor", "relay", "dcutr", "upnp"] }
tokio = { version = "1", features = ["rt-multi-thread", "macros", "sync", "time"] }
# Call media: one long-lived stream per peer instead of a request/response
# substream (and multistream round trip) per 60 ms audio packet. See call.rs.
libp2p-stream = "=0.1.0-alpha.1"
futures = "0.3"

# Database
# NOT: rusqlite 0.30 -> 0.32'ye yükseltildi çünkü arti (tor-dirmgr) rusqlite
# 0.32'ye KOŞULSUZ bağımlı; iki farklı libsqlite3-sys sürümü (ikisi de
# `links = "sqlite3"`) cargo'nun "multiple packages link to sqlite3"
# hatasıyla derlemeyi reddetmesine yol açardı. Tek sürüme hizalayarak
# çakışma önlendi (kullanılan API — Connection/execute/query_map/params/
# prepare — 0.30-0.32 arasında değişmedi).
# SQLCipher: the whole client database is encrypted (see `init_db`). OpenSSL
# is built from source so Android (NDK), desktop and the Flatpak SDK need no
# system libcrypto.
rusqlite = { version = "0.32", features = ["bundled-sqlcipher-vendored-openssl"] }

# Tor (onion service) — spec dışı, kullanıcı isteği: CGNAT arkasındaki
# cihazların birbirine ulaşabilmesi için (bkz. SECURITY.md "Tor onion"
# notu). native-tls YERİNE rustls (openssl cross-compile derdinden kaçınmak
# için); arti'nin rustls'i `ring` kullanıyor, o da bu projede zaten cross-
# compile ediliyor. onion-service-service = host etme, onion-service-client
# + keymgr = kalıcı .onion adresi.
arti-client = { version = "0.24", default-features = false, features = ["tokio", "rustls", "onion-service-client", "onion-service-service", "compression", "keymgr"] }
tor-hsservice = "0.24"
tor-cell = "0.24"
tor-config = "0.24"
tor-rtcompat = { version = "0.24", features = ["tokio", "rustls"] }

# Android JNI
jni = "0.21"
android_logger = "0.13"
log = "0.4"
lazy_static = "1.4"

[profile.release]
opt-level = "z"
lto = true
codegen-units = 1
strip = true

# TypeOn patch of tor-hsservice 0.24: stop re-uploading the onion descriptor
# every time an intro circuit is rebuilt (see vendor/tor-hsservice, "TypeOn patch").
[patch.crates-io]
tor-hsservice = { path = "vendor/tor-hsservice" }
tor-netdir = { path = "vendor/tor-netdir" }
