name: release
on:
  push:
    tags: ['v*']
  workflow_dispatch:   # build only, artifacts stay on the run (no release)

permissions:
  contents: write

# A "-" tag (v7.4.6-beta.2) is a pre-release and ships DEBUG builds; any other tag ships release builds.
env:
  DEBUG_BUILD: ${{ contains(github.ref_name, '-') && '1' || '' }}
  CARGO_PROFILE: ${{ contains(github.ref_name, '-') && 'dev' || 'release' }}
  PROFILE_DIR: ${{ contains(github.ref_name, '-') && 'debug' || 'release' }}
  GRADLE_ASSEMBLE: ${{ contains(github.ref_name, '-') && 'assembleDebug' || 'assembleRelease' }}

jobs:
  server:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
      - uses: Swatinem/rust-cache@d1527c8f67ef9af357290475d4af4b0fab8f12e0 # v2
        with: { workspaces: typeon-server }
      - run: cargo build --profile $CARGO_PROFILE --manifest-path typeon-server/Cargo.toml --bin typeon-server
      - run: |
          mkdir out
          cp typeon-server/target/$PROFILE_DIR/typeon-server out/typeon-server-linux
          cp typeon-server/data/typeon-server.service out/
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with: { name: server, path: out/* }

  windows:
    runs-on: ubuntu-24.04
    env:
      LLVM_MINGW: '20261104'
      LLVM_MINGW_SHA256: '919380403de87dca3c581c2053230cd298af5e891286628ba0613b7fed370926'
      CARGO_PROFILE_DEV_DEBUG: '0'   # debug exe is stripped anyway; DWARF filled the disk
    steps:
      - name: free disk
        run: sudo rm -rf /usr/share/dotnet /usr/local/lib/android /opt/ghc /opt/hostedtoolcache/CodeQL
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
      - uses: Swatinem/rust-cache@d1527c8f67ef9af357290475d4af4b0fab8f12e0 # v2
        with: { workspaces: Linux }
      - run: |
          sudo apt-get update
          sudo apt-get install -y zstd p7zip-full libglib2.0-bin
          rustup target add x86_64-pc-windows-gnullvm
          mkdir -p ~/tools
          curl -fsSL -o "$RUNNER_TEMP/llvm-mingw.tar.xz" "https://github.com/mstorsjo/llvm-mingw/releases/download/$LLVM_MINGW/llvm-mingw-$LLVM_MINGW-ucrt-ubuntu-22.04-x86_64.tar.xz"
          echo "$LLVM_MINGW_SHA256  $RUNNER_TEMP/llvm-mingw.tar.xz" | sha256sum -c -
          tar -xJf "$RUNNER_TEMP/llvm-mingw.tar.xz" -C ~/tools
      - run: python3 -I Linux/packaging/windows/fetch-sysroot.py
      - run: TYPEON_WIN_DEBUG=$DEBUG_BUILD Linux/packaging/windows/package.sh
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with: { name: windows, path: Linux/target/typeon-windows-*.zip }

  flatpak:
    runs-on: ubuntu-24.04
    steps:
      - name: free disk
        run: sudo rm -rf /usr/share/dotnet /usr/local/lib/android /opt/ghc /opt/hostedtoolcache/CodeQL
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
      - run: |
          sudo apt-get update
          sudo apt-get install -y flatpak flatpak-builder
          flatpak remote-add --user --if-not-exists flathub https://dl.flathub.org/repo/flathub.flatpakrepo
          flatpak install --user -y flathub org.gnome.Platform//49 org.gnome.Sdk//49 org.freedesktop.Sdk.Extension.rust-stable//25.08
      - run: |
          cd Linux/packaging
          if [ -n "$DEBUG_BUILD" ]; then
            sed -i 's|cargo build --release --manifest-path Linux/Cargo.toml|cargo build --manifest-path Linux/Cargo.toml|; s|Linux/target/release/typeon |Linux/target/debug/typeon |' com.p2p.messenger.Typeon.yml
            grep -q 'target/debug/typeon ' com.p2p.messenger.Typeon.yml
          fi
          flatpak-builder --user --force-clean --disable-rofiles-fuse --repo=repo build-dir com.p2p.messenger.Typeon.yml
          flatpak build-bundle repo ../../typeon-linux.flatpak com.p2p.messenger.Typeon
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with: { name: flatpak, path: typeon-linux.flatpak }

  android:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
      - uses: actions/setup-java@cf277c60eb25467037889841efdb72551f06f6c3 # v4
        with: { distribution: temurin, java-version: '21' }
      - uses: Swatinem/rust-cache@d1527c8f67ef9af357290475d4af4b0fab8f12e0 # v2
        with: { workspaces: p2p_messenger_android/app/src/main/cpp/rust }
      - run: |
          rustup target add aarch64-linux-android armv7-linux-androideabi x86_64-linux-android
          cargo install cargo-ndk --locked
      - name: build client + server apps
        run: |
          for d in p2p_messenger_android p2p_messenger_android_server; do
            (cd $d && ./gradlew --no-daemon $GRADLE_ASSEMBLE)
          done
      - name: collect unsigned
        run: |
          mkdir out
          VER=$(sed -n 's/.*versionName "\(.*\)"/\1/p' p2p_messenger_android/app/build.gradle | head -1)
          cp p2p_messenger_android/app/build/outputs/apk/$PROFILE_DIR/*.apk "out/typeon-client-$VER.apk"
          cp p2p_messenger_android_server/app/build/outputs/apk/$PROFILE_DIR/*.apk "out/typeon-server-$VER.apk"
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with: { name: android-unsigned, path: out/*.apk }

  sign:
    # only tag runs may enter the `release` environment (holds the signing secrets)
    if: startsWith(github.ref, 'refs/tags/v')
    needs: android
    runs-on: ubuntu-24.04
    environment: release
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
      - uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093 # v4
        with: { name: android-unsigned, path: out }
      - env:
          JKS: ${{ secrets.SIGNING_JKS_B64 }}
          PASS: ${{ secrets.SIGNING_PASS }}
          LINEAGE: ${{ secrets.SIGNING_LINEAGE_B64 }}
        run: |
          export TYPEON_SIGNING="$RUNNER_TEMP/sign"; mkdir -p "$TYPEON_SIGNING"
          echo "$JKS" | base64 -d > "$TYPEON_SIGNING/typeon-release.jks"
          echo "$LINEAGE" | base64 -d > "$TYPEON_SIGNING/lineage.bin"
          printf %s "$PASS" > "$TYPEON_SIGNING/pass.txt"
          export ANDROID_HOME=${ANDROID_HOME:-$ANDROID_SDK_ROOT}
          mkdir signed
          for a in out/*.apk; do ./sign-release.sh "$a" "signed/$(basename "$a")"; done
          rm -rf "$TYPEON_SIGNING"
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with: { name: android, path: signed/*.apk }

  release:
    if: startsWith(github.ref, 'refs/tags/v')
    needs: [server, windows, flatpak, sign]
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
      - name: every app carries the tag's version (the self-updater compares against it)
        env: { TAG: '${{ github.ref_name }}' }
        run: |
          V=${TAG#v}; bad=0
          for f in p2p_messenger_android/app/build.gradle p2p_messenger_android_server/app/build.gradle; do
            grep -q "versionName \"$V\"" $f || { echo "$f is not $V"; bad=1; }
          done
          for f in Linux/Cargo.toml typeon-server/Cargo.toml p2p_messenger_android/app/src/main/cpp/rust/Cargo.toml; do
            grep -m1 '^version' $f | grep -q "\"$V\"" || { echo "$f is not $V"; bad=1; }
          done
          exit $bad
      - uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093 # v4
        with: { path: dist, pattern: '{server,windows,flatpak,android}', merge-multiple: true }  # NOT android-unsigned: same filenames, would clobber the signed APKs
      - name: release
        env:
          GH_TOKEN: ${{ github.token }}
          TAG: ${{ github.ref_name }}
        run: |
          cd dist
          mv typeon-linux.flatpak "typeon-linux-${TAG#v}.flatpak"
          sha256sum * > SHA256SUMS
          # Apps install nothing until the owner signs these sums offline: tools/sign-update.sh <tag>.
          # A "-" tag (v7.4.0-beta.1) is a beta: only apps with "Beta updates" on take it.
          case "$TAG" in *-*) PRE=--prerelease;; *) PRE=;; esac
          gh release create "$TAG" -R "$GITHUB_REPOSITORY" -t "Typeon ${TAG#v}" $PRE --generate-notes * 2>/dev/null \
            || gh release upload "$TAG" -R "$GITHUB_REPOSITORY" --clobber *
