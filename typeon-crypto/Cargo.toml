[package]
name = "typeon-crypto"
version = "0.2.0"
edition = "2021"

# The audited crypto core of TypeOn lives here: identity, double ratchet, packet
# framing, and the server store-and-forward seal. The SAME code is compiled for
# both native (Android, Linux, relay) and browser (wasm32) targets, so the protocol
# is not written twice. This crate has no SQLite, libp2p, Tor or JNI: only pure
# crypto and serde. Anything that does not build for wasm (rusqlite, arti, libp2p)
# stays in the core (p2p_messenger_core).

[dependencies]
serde = { version = "1.0", features = ["derive"] }
serde_bytes = "0.11"
serde_json = "1.0"
ciborium = "0.2"
hex = "0.4"
base32 = "0.5"
# NOTE: versions MUST match the core (p2p_messenger_core/Cargo.toml) exactly, so
# both sides decode the same byte format. ml-dsa and ed25519 are deliberately not
# listed: these modules carry signatures and keys as raw bytes and do not need
# those crates.
ml-kem = { version = "0.3.4", features = ["zeroize", "getrandom"] }
x25519-dalek = { version = "2", features = ["static_secrets", "zeroize"] }
chacha20poly1305 = "0.10"
hkdf = "0.12"
sha2 = "0.10"
sha3 = "0.10"
zeroize = "1.7"
rand = "0.8"

# On wasm32, OsRng (getrandom 0.2) is backed by the browser's Crypto.getRandomValues.
# It does not build for the wasm target without the "js" feature. Native targets are unaffected.
[target.'cfg(target_arch = "wasm32")'.dependencies]
getrandom = { version = "0.2", features = ["js"] }
# ml-kem 0.3 draws from getrandom 0.4 (encapsulate, key generation).
getrandom_04 = { package = "getrandom", version = "0.4", features = ["wasm_js"] }
