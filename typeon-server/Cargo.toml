[package]
name = "typeon-server"
version = "8.0.0"
edition = "2021"
description = "Typeon — blind store-and-forward server (mailbox, encrypted archive, attachment blobs)"
license = "GPL-3.0-or-later"

[lib]
name = "typeon_server"
# "cdylib": the Android server app (see `p2p_messenger_android_server/`) builds
# this with cargo-ndk and calls it through JNI. Same pattern as the `p2p_messenger`
# cdylib on the client side.
crate-type = ["lib", "cdylib"]

[[bin]]
name = "typeon-server"
path = "src/bin/typeon-server.rs"

[dependencies]
# The ONLY definition of the protocol: identical to the types the client sends.
# Same reason as the Linux desktop client linking the core: there is no second
# copy to keep in sync by hand. `attachments` (reading and serving file chunks
# from disk) and `tor` (hosting the server's own onion service) also come from here.
p2p_messenger_core = { path = "../p2p_messenger_android/app/src/main/cpp/rust" }

# Versions MUST match the ones the client uses. `ServerRequest` and
# `FileChunkRequest` come from the core and are passed as parameters to libp2p's
# `request_response::cbor::Behaviour`. Two different libp2p versions would mean
# two types with the same name that are NOT the same type, and the build would
# fail. The same applies to rusqlite (`links = "sqlite3"` conflict, see the note
# in the core's Cargo.toml).
libp2p = { version = "0.53", features = ["tcp", "noise", "yamux", "identify", "kad", "tokio", "macros", "dns", "request-response", "cbor", "relay"] }
tokio = { version = "1", features = ["rt-multi-thread", "macros", "sync", "time", "signal"] }
futures = "0.3"
# Live call-media relay streams (see `RELAY_PROTOCOL`).
libp2p-stream = "=0.1.0-alpha.1"
# Same feature as the core: the keyed store needs SQLCipher, not plain SQLite.
rusqlite = { version = "0.32", features = ["bundled-sqlcipher-vendored-openssl"] }

serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"
ciborium = "0.2"
hex = "0.4"
zeroize = "1.7"
rand = "0.8"
sha2 = "0.10"
# For verifying enrollment signatures. The client generates a fresh Ed25519 pair
# for THIS server only (not the device identity key; see the `ServerRequest::Enroll`
# note). The server only verifies.
ed25519-dalek = "2"
# The enrollment signature is verified hybrid, the same way as in the rest of the
# app. Versions and features must match the core exactly: types such as
# `EncodedSignature` are not carried in the protocol, but both sides must produce
# the same encoding. The >=0.1.0-rc.4 requirement still applies
# (GHSA-5x2r-hc65-25f9, signature malleability).
ml-dsa = { version = "0.1.2", features = ["getrandom", "zeroize"] }
log = "0.4"
# For the headless Linux daemon. On Android, `android_logger` is used instead
# (see src/jni.rs).
env_logger = "0.11"

[target.'cfg(target_os = "android")'.dependencies]
jni = "0.21"
android_logger = "0.13"
lazy_static = "1.4"

[profile.release]
opt-level = 2
lto = "thin"
# Without a symbol table the Android .so files were about three times larger
# (25-34 MB instead of about 10 MB; APK 183 MB instead of about 60 MB). The core
# crate uses `strip = true` for the same reason. On the Linux daemon the only cost
# is that panic backtraces lose their symbols. The server diagnoses through
# `env_logger` output.
strip = true

# Same TypeOn patches (tor-hsservice, tor-netdir) as the core crate; cargo ignores the
# [patch] section of a path dependency, so every root manifest repeats it.
[patch.crates-io]
tor-hsservice = { path = "../p2p_messenger_android/app/src/main/cpp/rust/vendor/tor-hsservice" }
tor-netdir = { path = "../p2p_messenger_android/app/src/main/cpp/rust/vendor/tor-netdir" }
